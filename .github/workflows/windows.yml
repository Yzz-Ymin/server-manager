name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Build and test
        run: ./scripts/test.ps1 -Python python
      - name: Package unsigned development build
        run: ./scripts/package.ps1
      - name: Upload reports and development package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation
          retention-days: 7
          path: |
            windows/artifacts/tests/ui-results.txt
            windows/artifacts/tests/ssh-results.txt
            windows/artifacts/tests/form-preview.png
            windows/artifacts/packages/ServerManager-*-windows-unsigned.zip
